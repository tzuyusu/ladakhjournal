<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Route Globe</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Noto+Serif+TC:wght@600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#438A85}canvas{display:block;width:100%;height:100%}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const C = { ocean:'#3B7B76', land:'#AEC6C1', border:'rgba(67,138,133,.55)', grat:'rgba(245,203,122,.10)', rim:'rgba(245,203,122,.35)', route:'#F5CB7A', ink:'#F5CB7A' };
const cities = [
  { name:'Taipei', sub:'台北', ll:[121.565, 25.033] },
  { name:'Bangkok', sub:'曼谷', ll:[100.502, 13.756] },
  { name:'New Delhi', sub:'新德里', ll:[77.209, 28.614] },
  { name:'Leh', sub:'列城', ll:[77.577, 34.152] },
];
const zooms = [1, 1.15, 1.6, 2.6];
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
let W, H, DPR, land, borders;
const proj = d3.geoOrthographic().clipAngle(90).precision(0.3);
const path = d3.geoPath(proj, ctx);
const grat = d3.geoGraticule10();
let view = { rot: [-cities[0].ll[0], -cities[0].ll[1] + 8], zoom: 1 };
let legsDone = 0, legT = 0, plane = null, flying = false, idle = true, visited = 1;

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
}
addEventListener('resize', resize); resize();

function baseR() { return Math.max(W, H) * 0.52; }

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  proj.translate([W / 2, H * 0.62]).scale(baseR() * view.zoom).rotate([view.rot[0], view.rot[1], 0]);
  ctx.beginPath(); path({ type:'Sphere' }); ctx.fillStyle = C.ocean; ctx.fill();
  ctx.beginPath(); path(grat); ctx.strokeStyle = C.grat; ctx.lineWidth = 1; ctx.stroke();
  if (land) {
    ctx.beginPath(); path(land); ctx.fillStyle = C.land; ctx.fill();
    ctx.beginPath(); path(borders); ctx.strokeStyle = C.border; ctx.lineWidth = 0.8; ctx.stroke();
  }
  ctx.beginPath(); path({ type:'Sphere' }); ctx.strokeStyle = C.rim; ctx.lineWidth = 1.2; ctx.stroke();

  // completed legs + current leg
  ctx.setLineDash([6, 6]); ctx.lineWidth = 2; ctx.strokeStyle = C.route;
  for (let i = 0; i < legsDone; i++) { ctx.beginPath(); path({ type:'LineString', coordinates: arc(i, 1) }); ctx.stroke(); }
  if (flying) { ctx.beginPath(); path({ type:'LineString', coordinates: arc(legsDone, legT) }); ctx.stroke(); }
  ctx.setLineDash([]);

  cities.forEach((c, i) => {
    if (i >= visited && !(flying && i === legsDone + 1)) return;
    const p = proj(c.ll); if (!p || !visible(c.ll)) return;
    const active = i < visited;
    ctx.beginPath(); ctx.arc(p[0], p[1], active ? 5 : 3.5, 0, Math.PI * 2);
    ctx.fillStyle = active ? C.ink : 'rgba(245,203,122,.5)'; ctx.fill();
    ctx.beginPath(); ctx.arc(p[0], p[1], 11, 0, Math.PI * 2); ctx.strokeStyle = active ? 'rgba(245,203,122,.6)' : 'rgba(245,203,122,.25)'; ctx.lineWidth = 1; ctx.stroke();
    if (!active) return;
    const lx = p[0] + 18, ly = p[1] + (i === 3 ? -10 : 6);
    ctx.fillStyle = '#FFF6E0';
    ctx.font = "600 22px 'Playfair Display', serif"; ctx.fillText(c.name, lx, ly);
    ctx.font = "600 13px 'Noto Serif TC', serif"; ctx.fillStyle = C.ink; ctx.fillText(c.sub, lx, ly + 20);
  });

  if (plane && flying) drawPlane(plane.p, plane.a);
}
function visible(ll) { return d3.geoDistance(ll, [-view.rot[0], -view.rot[1]]) < Math.PI / 2 - 0.02; }
function arc(i, t) {
  const f = d3.geoInterpolate(cities[i].ll, cities[i + 1].ll), n = 64, pts = [];
  for (let k = 0; k <= n * t; k++) pts.push(f(k / n));
  pts.push(f(t)); return pts;
}
function drawPlane(p, a) {
  ctx.save(); ctx.translate(p[0], p[1]); ctx.rotate(a);
  ctx.fillStyle = '#FFF6E0'; ctx.strokeStyle = '#2F6B66'; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(14, 0); ctx.lineTo(2, -2); ctx.lineTo(-4, -12); ctx.lineTo(-7, -12); ctx.lineTo(-3, -2);
  ctx.lineTo(-10, -2); ctx.lineTo(-13, -6); ctx.lineTo(-15, -6); ctx.lineTo(-13, 0);
  ctx.lineTo(-15, 6); ctx.lineTo(-13, 6); ctx.lineTo(-10, 2); ctx.lineTo(-3, 2); ctx.lineTo(-7, 12);
  ctx.lineTo(-4, 12); ctx.lineTo(2, 2); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();
}
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
function tween(ms, fn) { return new Promise(res => { const s = performance.now(); const step = now => { const t = Math.min(1, (now - s) / ms); fn(t); if (t < 1) requestAnimationFrame(step); else res(); }; requestAnimationFrame(step); }); }
const wait = ms => new Promise(r => setTimeout(r, ms));

async function fly() {
  if (flying) return;
  idle = false; legsDone = 0; visited = 1; plane = null;
  // settle on Taipei
  const r0 = view.rot.slice(), z0 = view.zoom, target = [-cities[0].ll[0], -cities[0].ll[1] + 8];
  await tween(900, t => { const e = ease(t); view.rot = [r0[0] + (target[0] - r0[0]) * e, r0[1] + (target[1] - r0[1]) * e]; view.zoom = z0 + (zooms[0] - z0) * e; });
  flying = true;
  for (let i = 0; i < cities.length - 1; i++) {
    legsDone = i;
    const f = d3.geoInterpolate(cities[i].ll, cities[i + 1].ll);
    const dist = d3.geoDistance(cities[i].ll, cities[i + 1].ll);
    const ms = 1400 + dist * 5200;
    const za = zooms[i], zb = zooms[i + 1];
    await tween(ms, t => {
      const e = ease(t); legT = e;
      const pos = f(e), ahead = f(Math.min(1, e + 0.02));
      view.rot = [-pos[0], -pos[1] + 8 / (za + (zb - za) * e)];
      view.zoom = (za + (zb - za) * e) * (1 - 0.12 * Math.sin(Math.PI * e));
      proj.scale(baseR() * view.zoom).rotate([view.rot[0], view.rot[1], 0]).translate([W / 2, H * 0.62]);
      const p = proj(pos), q = proj(ahead);
      plane = { p, a: Math.atan2(q[1] - p[1], q[0] - p[0]) };
    });
    legsDone = i + 1; visited = i + 2; legT = 0;
    parent.postMessage({ globe: 'arrived', city: cities[i + 1].name }, '*');
    if (i < cities.length - 2) await wait(700);
  }
  flying = false;
  parent.postMessage({ globe: 'done' }, '*');
}
addEventListener('message', e => { if (e.data && e.data.globe === 'fly') fly(); });

function loop() {
  if (idle) view.rot[0] -= 0.03;
  draw(); requestAnimationFrame(loop);
}
fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json').then(r => r.json()).then(topo => {
  land = topojson.feature(topo, topo.objects.countries);
  borders = topojson.mesh(topo, topo.objects.countries, (a, b) => a !== b);
});
document.fonts && document.fonts.load("600 22px 'Playfair Display'");
loop();
</script>
</body>
</html>
